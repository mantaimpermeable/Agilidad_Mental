name: Tests

on:
  pull_request:
    branches:
      [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: java --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests w gradle
        run: ./gradlew test